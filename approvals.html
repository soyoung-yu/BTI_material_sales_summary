<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승인 요청 - BTI 소재 매출 리포트</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a}
        .header{background:#1a365d;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
        .header h1{margin:0;font-size:20px}
        .user-info{display:flex;align-items:center;gap:8px}
        .team-badge{background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px;font-size:12px}
        .nav{background:#fff;border-bottom:1px solid #e2e8f0}
        .nav ul{margin:0;padding:0 24px;list-style:none;display:flex;gap:8px}
        .nav a{display:block;padding:14px 16px;color:#475569;text-decoration:none;border-bottom:2px solid transparent}
        .nav a.active{color:#1a365d;border-bottom-color:#1a365d;font-weight:600}
        .main{max-width:1200px;margin:0 auto;padding:24px}
        .page-title{margin:0 0 6px;font-size:24px}
        .page-desc{margin:0 0 14px;color:#64748b}
        .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}
        .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
        .badge{padding:4px 8px;border-radius:999px;font-size:12px}
        .badge.pending{background:#fef3c7;color:#92400e}
        .badge.approved{background:#dcfce7;color:#166534}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th,td{padding:10px 8px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}
        th{background:#f8fafc;color:#475569}
        .btn{border:1px solid #cbd5e1;background:#fff;color:#0f172a;padding:8px 10px;border-radius:8px;cursor:pointer}
        .btn.primary{background:#1a365d;border-color:#1a365d;color:#fff}
        .btn.danger{background:#fee2e2;border-color:#fecaca;color:#b91c1c}
        .action-group{display:flex;gap:6px}
        .empty{padding:32px 12px;text-align:center;color:#64748b}
        .toast{position:fixed;right:24px;bottom:24px;background:#1a365d;color:#fff;padding:12px 16px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s}
        .toast.show{opacity:1;transform:translateY(0)}
    </style>
</head>
<body>
    <header class="header">
        <h1>BTI 소재 매출 리포트</h1>
        <div class="user-info"></div>
    </header>
    <nav class="nav"><ul></ul></nav>

    <main class="main">
        <h2 class="page-title">승인 요청</h2>
        <p class="page-desc">팀원/사용자의 소재 추가·수정·삭제 신청을 승인합니다.</p>

        <section class="card">
            <div class="toolbar">
                <div id="scopeInfo" style="color:#64748b;font-size:13px;"></div>
                <button class="btn" id="refreshBtn">새로고침</button>
            </div>
            <div style="overflow:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>상태</th>
                            <th>요청유형</th>
                            <th>소재코드</th>
                            <th>소재명</th>
                            <th>요청자</th>
                            <th>팀</th>
                            <th>요청시각</th>
                            <th>처리</th>
                        </tr>
                    </thead>
                    <tbody id="approvalsTbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script src="api-config.js"></script>
    <script src="api-client.js?v=20260225b"></script>
    <script src="auth.js?v=20260225a"></script>
    <script src="materials-store.js?v=20260225b"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const auth = window.BTIAuth.bootstrap({ page: 'approvals' });
            if (auth?.denied) return;
            currentUser = auth.user;
            document.getElementById('refreshBtn').addEventListener('click', () => { renderPendingRows(); });
            await renderPendingRows();
        });

        async function renderPendingRows() {
            const rows = await window.BTIMaterialsStore.getPendingRequests(currentUser);
            document.getElementById('scopeInfo').textContent =
                currentUser.role === 'ADMIN'
                    ? '관리자 권한: 전체 팀 승인 요청 조회/승인 가능'
                    : `${currentUser.team_name || currentUser.team_id} 권한: 본인 팀 승인 요청만 조회/승인 가능`;

            const tbody = document.getElementById('approvalsTbody');
            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="empty">승인 대기 요청이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = rows.map(r => `
                <tr>
                    <td><span class="badge pending">${formatRequestStatus(r.request_status)}</span></td>
                    <td>${r.request_type}</td>
                    <td>${r.raw_cd || ''}</td>
                    <td>${r.raw_nm || ''}</td>
                    <td>${r.requested_by || '-'}</td>
                    <td>${r.requested_by_team_id || '-'}</td>
                    <td>${formatDt(r.requested_at)}</td>
                    <td>
                        <div class="action-group">
                            <button class="btn primary" data-action="approve" data-id="${r._id || r.request_id}">승인</button>
                            <button class="btn danger" data-action="reject" data-id="${r._id || r.request_id}">반려</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            tbody.querySelectorAll('button[data-id]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const rowId = btn.dataset.id;
                    if (btn.dataset.action === 'reject') {
                        reject(rowId);
                        return;
                    }
                    approve(rowId);
                });
            });
        }

        async function approve(rowId) {
            try {
                await window.BTIMaterialsStore.approveRequest(rowId, currentUser);
                await renderPendingRows();
                showToast('승인 처리되었습니다.');
            } catch (err) {
                showToast(err.message || '승인 처리에 실패했습니다.');
            }
        }

        async function reject(rowId) {
            try {
                await window.BTIMaterialsStore.rejectRequest(rowId, currentUser);
                await renderPendingRows();
                showToast('반려 처리되었습니다.');
            } catch (err) {
                showToast(err.message || '반려 처리에 실패했습니다.');
            }
        }

        function formatRequestStatus(status) {
            const s = String(status || '').toUpperCase();
            if (s === 'APPROVED') return '완료';
            if (s === 'REJECTED') return '반려';
            return '신청';
        }

        function formatDt(v) {
            if (!v) return '-';
            const d = new Date(v);
            if (Number.isNaN(d.getTime())) return String(v);
            return d.toLocaleString('ko-KR');
        }

        function showToast(message) {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2200);
        }
    </script>
</body>
</html>
